<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wykonał DZIUBA</title>
</head>
<body bgcolor="silver">
<center>
    <h1>SKLEP NIKE</h1>
    <h2>FORMULARZ ZAMÓWIENIA</h2>
</center>
<form>
    Imię: <input type="text" name="imie"><br><br>
    Nazwisko: <input type="text" name="nazwisko"><br><br>
    E-mail: <input type="email" name="email"><br><br>
    Wybierz produkt:
    <select name="produkt">
        <option>Buty Nike</option>
        <option>Koszulka Nike</option>
        <option>Bluza Nike</option>
        <option>Spodenki Nike</option>
    </select>
    <br><br>
    Rozmiar:
    <input type="radio" name="rozmiar" value="S"> S
    <input type="radio" name="rozmiar" value="M"> M
    <input type="radio" name="rozmiar" value="L"> L
    <input type="radio" name="rozmiar" value="XL"> XL
    <br><br>
    Dodatkowe informacje:<br>
    <textarea name="informacje" rows="4" cols="30"></textarea>
    <br><br>
    <input type="submit" value="Wyślij">
    <input type="reset" value="Wyczyść">
</form>
